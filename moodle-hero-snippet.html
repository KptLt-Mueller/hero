    <div class="mgk-status" aria-hidden="true"><span class="mgk-dot"></span><span><span class="mgk-typed">&gt; KI-Tutor wird initialisiert …</span><span class="mgk-caret"></span></span></div>
  </div>

  <div class="mgk-sweep"></div>
  <div class="mgk-corner mgk-c1"></div>
  <div class="mgk-corner mgk-c2"></div>
  <div class="mgk-edge"></div>
  <div class="mgk-reticle" aria-hidden="true">
    <svg viewBox="0 0 40 40">
      <g class="rs"><circle cx="20" cy="20" r="14" fill="none" stroke="#5ff0ff" stroke-opacity=".85" stroke-width="1.2" stroke-dasharray="6 4"/></g>
      <path d="M20 1v7M20 32v7M1 20h7M32 20h7" stroke="#5ff0ff" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="20" cy="20" r="1.9" fill="#9dffb0"/>
    </svg>
    <span>FOKUS</span>
  </div>
</div>

<script>
(function () {
  'use strict';
  var COLS = 7, ROWS = 5;
  var EYE_Y = 0.40;           /* Augenhöhe im Foto (Anteil der Bildhöhe) */
  var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var MSGS = ['> KI-Tutor wird initialisiert …', '> Lernpfad wird personalisiert …', '> Wissen vernetzen – einsatzbereit lernen.', '> Digitale Ausbildung: online.'];

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function bits() { var a = []; for (var j = 0; j < 7; j++) a.push(Math.random() < 0.5 ? '0' : '1'); return a; }
  function pos(c, r) { return (COLS > 1 ? c / (COLS - 1) * 100 : 0) + '% ' + (ROWS > 1 ? r / (ROWS - 1) * 100 : 0) + '%'; }

  function init(root) {
    if (root.getAttribute('data-mgk-ready')) return;
    root.setAttribute('data-mgk-ready', '1');

    var photo = root.querySelector('.mgk-photo');
    var cam = root.querySelector('.mgk-cam');
    var holo = root.querySelector('.mgk-holo'), holo2 = root.querySelector('.mgk-holo2'), title = root.querySelector('.mgk-title');
    var ov = root.querySelector('.mgk-ov');
    var track = root.querySelector('.mgk-track');
    var canvas = root.querySelector('.mgk-fx');
    if (!photo || !canvas || !canvas.getContext) return;
    var ctx = canvas.getContext('2d');
    var frames = root.querySelectorAll('.mgk-f');
    var huds = root.querySelectorAll('.mgk-hud');
    var reticle = root.querySelector('.mgk-reticle');

    var W = 0, H = 0, parts = [], cols = [], circ = [], sparks = [];
    var hb = { l: 0, t: 0, w: 1, h: 1, cx: 0, cy: 0 };
    var ptr = { x: 0, y: 0, on: false }, tgt = { x: 0, y: 0 }, mid = { x: 0, y: 0 }, cur = { x: 0, y: 0 };
    var vis = {}, near = -1;
    for (var fi = 0; fi < frames.length; fi++) if (frames[fi].className.indexOf('on') > 0) { vis[fi] = 1; near = fi; }

    /* bis zu 4 benachbarte Posen stufenlos überblenden (bilinear) */
    function blend(gx, gy) {
      var c0 = clamp(Math.floor(gx), 0, COLS - 2), r0 = clamp(Math.floor(gy), 0, ROWS - 2);
      var fx = clamp(gx - c0, 0, 1), fy = clamp(gy - r0, 0, 1);
      var ids = [r0 * COLS + c0, r0 * COLS + c0 + 1, (r0 + 1) * COLS + c0, (r0 + 1) * COLS + c0 + 1];
      var ws = [(1 - fx) * (1 - fy), fx * (1 - fy), (1 - fx) * fy, fx * fy];
      var ord = [0, 1, 2, 3].sort(function (a, b) { return ws[b] - ws[a]; });
      var nv = {}, acc = 0, k, i, el, id;
      for (k = 0; k < 4; k++) {
        i = ord[k]; acc += ws[i];
        if (k > 0 && ws[i] < 0.012) continue;
        id = ids[i]; el = frames[id]; nv[id] = 1;
        el.style.opacity = k === 0 ? '1' : (ws[i] / acc).toFixed(3);
        el.style.zIndex = String(k + 1);
        el.style.display = 'block';
      }
      for (id in vis) if (!nv[id]) frames[id].style.display = 'none';
      vis = nv;
      var nc = Math.round(gx), nr = Math.round(gy), n = nr * COLS + nc;
      if (n !== near) {
        near = n; var ps = pos(nc, nr);
        holo.style.backgroundPosition = ps; holo2.style.backgroundPosition = ps;
        ov.style.webkitMaskPosition = ps; ov.style.maskPosition = ps;
      }
    }

    /* ---------- Maße ---------- */
    function measure() {
      var r = root.getBoundingClientRect();
      W = r.width; H = r.height;
      root.classList.toggle('mgk-md', W < 1000);
      root.classList.toggle('mgk-sm', W < 600);
      root.classList.toggle('mgk-xs', W < 440);
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.max(1, Math.round(W * dpr));
      canvas.height = Math.max(1, Math.round(H * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var p = photo.getBoundingClientRect();
      hb.l = p.left - r.left; hb.t = p.top - r.top; hb.w = p.width; hb.h = p.height;
      hb.cx = hb.l + hb.w / 2; hb.cy = hb.t + hb.h * EYE_Y;
      var n = clamp(Math.round(W * H / 7000), 20, 80), i;
      parts = [];
      for (i = 0; i < n; i++) parts.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.35, r: Math.random() * 1.4 + 0.6, g: Math.random() < 0.22 });
      cols = [];
      for (var x = W * 0.3; x < W; x += 16) cols.push({ x: x, y: Math.random() * H * 1.4 - H * 0.4, sp: 0.25 + Math.random() * 0.6, c: bits() });
      circ = [];
      var nC = W < 600 ? 4 : 10;
      for (i = 0; i < nC; i++) {
        var cx = W * (0.32 + Math.random() * 0.68), cy = 6 + Math.random() * (H - 12), pts = [[cx, cy]], dir = Math.random() < 0.5 ? 0 : 1, len = 0;
        for (var s2 = 0; s2 < 4; s2++) {
          var L = 26 + Math.random() * 90, px = cx, py = cy;
          if (dir === 0) cx = clamp(cx + (Math.random() < 0.5 ? -L : L), W * 0.3, W - 4);
          else cy = clamp(cy + (Math.random() < 0.5 ? -L : L) * 0.6, 6, H - 6);
          len += Math.abs(cx - px) + Math.abs(cy - py); pts.push([cx, cy]); dir = 1 - dir;
        }
        circ.push({ p: pts, len: len, o: Math.random() * len, sp: 45 + Math.random() * 80 });
      }
    }
    function along(c, d) {
      for (var s3 = 1; s3 < c.p.length; s3++) {
        var a = c.p[s3 - 1], b = c.p[s3], l = Math.abs(b[0] - a[0]) + Math.abs(b[1] - a[1]);
        if (d <= l) { var u = l ? d / l : 0; return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]; }
        d -= l;
      }
      return null;
    }

    /* ---------- Maus / Touch ---------- */
    function setPtr(e) {
      var r = root.getBoundingClientRect();
      ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top;
      if (!ptr.on) { ptr.on = true; root.classList.add('is-active'); }
      if (reticle) reticle.style.transform = 'translate3d(' + ptr.x + 'px,' + ptr.y + 'px,0)';
    }
    function off() { ptr.on = false; root.classList.remove('is-active'); }
    root.addEventListener('pointermove', setPtr);
    root.addEventListener('pointerdown', setPtr);
    root.addEventListener('pointerleave', off);
    root.addEventListener('pointercancel', off);

    /* ---------- Kopf: Posen stufenlos ---------- */
    function apply(nx, ny) {
      blend((nx + 1) / 2 * (COLS - 1), (ny + 1) / 2 * (ROWS - 1));
      cam.style.transform = 'translate3d(' + (nx * 2.5).toFixed(2) + 'px,' + (ny * 1.5).toFixed(2) + 'px,0)';
      if (track) track.style.transform = 'translate3d(' + (nx * hb.w * 0.085).toFixed(1) + 'px,' + (ny * hb.h * 0.035).toFixed(1) + 'px,0)';
      for (var h = 0; h < huds.length; h++) huds[h].style.transform = 'translate(' + (-nx * 7).toFixed(1) + 'px,' + (-ny * 3).toFixed(1) + 'px)';
    }

    /* ---------- Hintergrund: Datenregen + Netzwerk ---------- */
    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      var i, j, p, o, dx, dy, d2, a;
      ctx.font = '600 10px Consolas, "Courier New", monospace';
      ctx.textAlign = 'center';
      for (i = 0; i < cols.length; i++) {
        var c = cols[i];
        if (!RM) c.y += c.sp;
        if (c.y - 7 * 13 > H) { c.y = -Math.random() * 60; c.c = bits(); }
        if (Math.random() < 0.03) c.c[(Math.random() * 7) | 0] = Math.random() < 0.5 ? '0' : '1';
        var fx = clamp((c.x - W * 0.3) / (W * 0.7), 0, 1);
        for (j = 0; j < 7; j++) {
          var yy = c.y - j * 13;
          if (yy < -10 || yy > H + 10) continue;
          a = (j === 0 ? 0.5 : (1 - j / 7) * 0.22) * (0.35 + fx * 0.65);
          ctx.fillStyle = 'rgba(95,240,255,' + a.toFixed(3) + ')';
          ctx.fillText(c.c[j], c.x, yy);
        }
      }
      /* Leiterbahnen mit wandernden Datenimpulsen */
      ctx.lineWidth = 1;
      for (i = 0; i < circ.length; i++) {
        var cc = circ[i], q;
        ctx.strokeStyle = 'rgba(95,240,255,.13)';
        ctx.beginPath(); ctx.moveTo(cc.p[0][0], cc.p[0][1]);
        for (j = 1; j < cc.p.length; j++) ctx.lineTo(cc.p[j][0], cc.p[j][1]);
        ctx.stroke();
        q = cc.p[cc.p.length - 1];
        ctx.fillStyle = 'rgba(95,240,255,.45)'; ctx.fillRect(q[0] - 2, q[1] - 2, 4, 4);
        var dd = (cc.o + (RM ? 0 : t * cc.sp)) % (cc.len + 80);
        for (j = 0; j < 6; j++) {
          q = along(cc, dd - j * 5); if (!q) continue;
          a = j === 0 ? 0.95 : 0.5 * (1 - j / 6);
          ctx.fillStyle = 'rgba(170,252,255,' + a.toFixed(3) + ')';
          ctx.beginPath(); ctx.arc(q[0], q[1], j === 0 ? 2 : 1.4, 0, 6.2832); ctx.fill();
          if (j === 0) { ctx.fillStyle = 'rgba(95,240,255,.16)'; ctx.beginPath(); ctx.arc(q[0], q[1], 6, 0, 6.2832); ctx.fill(); }
        }
      }
      /* Daten-Funken, die vom Soldaten aufsteigen */
      if (!RM && sparks.length < 46 && Math.random() < 0.55)
        sparks.push({ x: hb.l + hb.w * (0.12 + Math.random() * 0.76), y: hb.t + hb.h * (0.45 + Math.random() * 0.5),
          vy: -(0.25 + Math.random() * 0.7), vx: (Math.random() - 0.5) * 0.25, s: 1.4 + Math.random() * 2.2, l: 0, m: 70 + Math.random() * 90 });
      for (i = sparks.length - 1; i >= 0; i--) {
        p = sparks[i]; p.x += p.vx; p.y += p.vy; p.l++;
        if (p.l > p.m) { sparks.splice(i, 1); continue; }
        a = Math.sin(p.l / p.m * 3.1416) * 0.8;
        ctx.fillStyle = (i % 4 ? 'rgba(120,240,255,' : 'rgba(157,255,176,') + a.toFixed(3) + ')';
        ctx.fillRect(p.x, p.y, p.s, p.s);
      }
      for (i = 0; i < parts.length; i++) {
        p = parts[i];
        if (!RM) { p.x += p.vx; p.y += p.vy; }
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
        if (ptr.on) { dx = ptr.x - p.x; dy = ptr.y - p.y; d2 = dx * dx + dy * dy; if (d2 < 25600 && d2 > 400) { p.x += dx * 0.0025; p.y += dy * 0.0025; } }
      }
      var MAX = 105, MAX2 = MAX * MAX;
      ctx.lineWidth = 0.7;
      for (i = 0; i < parts.length; i++) {
        p = parts[i];
        var f = 0.45 + 0.55 * clamp(p.x / (W * 0.6), 0, 1);
        for (j = i + 1; j < parts.length; j++) {
          o = parts[j]; dx = p.x - o.x; dy = p.y - o.y; d2 = dx * dx + dy * dy;
          if (d2 < MAX2) {
            a = (1 - Math.sqrt(d2) / MAX) * 0.24 * f;
            ctx.strokeStyle = 'rgba(95,240,255,' + a.toFixed(3) + ')';
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(o.x, o.y); ctx.stroke();
          }
        }
      }
      if (ptr.on) {
        for (i = 0; i < parts.length; i++) {
          p = parts[i]; dx = ptr.x - p.x; dy = ptr.y - p.y; d2 = dx * dx + dy * dy;
          if (d2 < 22500) {
            a = (1 - Math.sqrt(d2) / 150) * 0.55;
            ctx.strokeStyle = 'rgba(157,255,176,' + a.toFixed(3) + ')';
            ctx.beginPath(); ctx.moveTo(ptr.x, ptr.y); ctx.lineTo(p.x, p.y); ctx.stroke();
          }
        }
      }
      for (i = 0; i < parts.length; i++) {
        p = parts[i];
        ctx.fillStyle = p.g ? 'rgba(157,255,176,.8)' : 'rgba(160,240,255,.72)';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
      }
      if (ptr.on) { /* Blicklinie vom Gesicht zum Mauszeiger */
        var ex = hb.cx + cur.x * hb.w * 0.07, ey = hb.cy + cur.y * hb.h * 0.03;
        var gr = ctx.createLinearGradient(ex, ey, ptr.x, ptr.y);
        gr.addColorStop(0, 'rgba(95,240,255,0)'); gr.addColorStop(1, 'rgba(95,240,255,.65)');
        ctx.strokeStyle = gr; ctx.lineWidth = 1;
        ctx.setLineDash([3, 5]); ctx.lineDashOffset = -t * 40;
        ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ptr.x, ptr.y); ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    /* ---------- Loop ---------- */
    var t0 = performance.now(), prev = t0, raf = 0, inView = true, nextGlitch = t0 + 4000, glitchEnd = 0;
    function running() { return inView && !document.hidden; }
    function frame(now) {
      raf = 0;
      var t = (now - t0) / 1000;
      if (ptr.on) {
        tgt.x = clamp((ptr.x - hb.cx) / Math.max(180, W * 0.26), -1, 1);
        tgt.y = clamp((ptr.y - hb.cy) / 90, -1, 1);
      } else if (RM) { tgt.x = 0; tgt.y = 0; }
      else { tgt.x = Math.sin(t * 0.35) * 0.75; tgt.y = Math.sin(t * 0.23 + 1.3) * 0.5; }
      var dt = Math.min(0.05, Math.max(0.001, (now - prev) / 1000)); prev = now;
      var rate = ptr.on ? 9 : 2.2, a1 = 1 - Math.exp(-dt * rate * 1.5), a2 = 1 - Math.exp(-dt * rate);
      mid.x += (tgt.x - mid.x) * a1; mid.y += (tgt.y - mid.y) * a1;
      cur.x += (mid.x - cur.x) * a2; cur.y += (mid.y - cur.y) * a2;
      apply(cur.x, cur.y);
      if (!RM) {
        if (now > nextGlitch) {
          photo.classList.add('glitch'); if (title && Math.random() < 0.45) title.classList.add('glitch');
          glitchEnd = now + 120 + Math.random() * 90; nextGlitch = now + 2600 + Math.random() * 3400;
        }
        if (glitchEnd && now > glitchEnd) { photo.classList.remove('glitch'); if (title) title.classList.remove('glitch'); glitchEnd = 0; }
      }
      draw(t);
      if (running()) raf = requestAnimationFrame(frame);
    }
    function start() { if (!raf && running()) raf = requestAnimationFrame(frame); }

    measure();
    if (window.ResizeObserver) new ResizeObserver(measure).observe(root);
    else window.addEventListener('resize', measure);
    if (window.IntersectionObserver) new IntersectionObserver(function (en) { inView = en[0].isIntersecting; start(); }).observe(root);
    document.addEventListener('visibilitychange', start);
    start();

    /* ---------- HUD-Werte ---------- */
    var req = root.querySelector('[data-mgk="req"]'), pct = root.querySelector('[data-mgk="pct"]'), bar = root.querySelector('[data-mgk="bar"]'), idl = root.querySelector('[data-mgk="id"]');
    var reqN = 1284, pctN = 0;
    var pt = setInterval(function () {
      pctN = Math.min(87, pctN + 3);
      pct.textContent = pctN; bar.style.width = pctN + '%';
      if (pctN >= 87) clearInterval(pt);
    }, 60);
    setInterval(function () {
      if (!running()) return;
      reqN += 1 + ((Math.random() * 4) | 0);
      req.textContent = reqN.toLocaleString('de-DE');
      if (idl) idl.textContent = 'KI-ANALYSE · ' + (97 + Math.random() * 2.9).toFixed(1).replace('.', ',') + ' %';
    }, 1400);

    /* ---------- Statuszeile tippen ---------- */
    var typed = root.querySelector('.mgk-typed');
    if (typed && !RM) {
      var mi = 0, ci = MSGS[0].length, mode = 'hold';
      (function step() {
        var m = MSGS[mi];
        if (mode === 'type') {
          ci++; typed.textContent = m.slice(0, ci);
          if (ci >= m.length) { mode = 'hold'; return setTimeout(step, 2400); }
          return setTimeout(step, 35 + Math.random() * 45);
        }
        if (mode === 'hold') { mode = 'erase'; return setTimeout(step, 10); }
        ci--; typed.textContent = m.slice(0, Math.max(2, ci));
        if (ci <= 2) { mode = 'type'; mi = (mi + 1) % MSGS.length; ci = 2; return setTimeout(step, 250); }
        setTimeout(step, 16);
      })();
    }
  }

  function boot() { var els = document.querySelectorAll('.mgk-hero'); for (var i = 0; i < els.length; i++) init(els[i]); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
